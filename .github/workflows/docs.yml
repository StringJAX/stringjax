name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install only the documentation toolchain; the hub does not import the member
      # packages, and conf.py falls back to a default version if stringjax is absent.
      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build HTML (warnings are errors)
        run: sphinx-build -W -b html docs docs/_build/html
      # Link checking depends on third-party sites being reachable, so a failure
      # here is informational and must not block a pull request.
      - name: Link check
        continue-on-error: true
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
