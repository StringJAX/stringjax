name: test-install

# Full-ecosystem install check: verifies that the metapackage resolves and installs
# a coherent set of member packages, and that the environment helper runs.
#
# It installs the member packages from PyPI (all are published), so it runs on pull
# requests as well as by hand and weekly.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core)
        run: python -m pip install .
      - name: Import the ecosystem
        run: |
          python -c "import stringjax, jaxvacua, jaxpolylog, stringjax_tools; print(stringjax.__version__)"
      - name: Run diagnostics
        run: stringjax doctor
