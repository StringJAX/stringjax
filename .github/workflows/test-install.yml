name: test-install

# Full-ecosystem install check: verifies that the metapackage resolves and installs
# a coherent set of member packages, and that the environment helper runs.
#
# NOTE: this requires the member packages (jaxvacua, jaxpolylog, ...) to be available
# on PyPI. Until they are published it is run manually / on a schedule only, so that
# ordinary pull requests are not blocked. Re-enable `pull_request` once the members
# are released.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core)
        run: python -m pip install .
      - name: Import the ecosystem
        run: |
          python -c "import stringjax, jaxvacua, jaxpolylog; print(stringjax.__version__)"
      - name: Run diagnostics
        run: stringjax doctor
