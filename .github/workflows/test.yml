name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install the metapackage WITHOUT its dependencies so the unit tests do not
      # require the (possibly unpublished) member packages. The doctor/CLI helpers
      # are designed to work even when no member is installed.
      - name: Install (no deps) + pytest
        run: |
          python -m pip install -e . --no-deps
          python -m pip install pytest
      - name: Run unit tests
        run: pytest -q
